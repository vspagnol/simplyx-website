.p{stroke:#12b5fb;stroke-width:1.8;stroke-linecap:round;stroke-dasharray:34 966;stroke-dashoffset:1000;animation:run 9s linear infinite}
.p2{animation-duration:12s;animation-delay:-4s}.p3{animation-duration:10s;animation-delay:-7s}.p4{animation-duration:14s;animation-delay:-2s}
.b{fill:#12b5fb;animation:blink 4s ease-in-out infinite}.b2{animation-delay:-1.3s}.b3{animation-delay:-2.6s}
